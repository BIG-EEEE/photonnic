<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photonic</title>
  <meta name="description" content="Your life, one photo at a time.">
  <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photonic">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <script>
    // Paint in the right theme before the journal opens (the choice itself lives in IndexedDB).
    try {
      var t = localStorage.getItem("photonic-theme");
      var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = dark ? "#121211" : "#F8F7F4"; });
    } catch (e) {}
  </script>
</head>
<body>
  <main class="ph" id="ph"></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
